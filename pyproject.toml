[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-analytics"
version = "0.1.0"
description = "Privacy-preserving gaze analytics for digital signage on low-power Intel platforms"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Jeevank", email = "jeevan.k@intel.com" }]
keywords = ["openvino", "gaze", "signage", "privacy", "analytics", "intel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26,<3",
    "mss>=9.0",
    "ImageHash>=4.3",
    "Pillow>=10.0",
    "openvino>=2024.4",
    "openvino-dev>=2024.4",
    "filterpy>=1.4.5",
    "scipy>=1.11",
    "streamlit>=1.34",
    "streamlit-autorefresh>=1.0",
    "pandas>=2.2",
    "plotly>=5.20",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyinstaller>=6.6",
]

[project.scripts]
gaze-analytics = "gaze_analytics.main:app"

[project.urls]
Homepage = "https://github.com/Jeevank11/Gaze_monitoring_system"
Issues = "https://github.com/Jeevank11/Gaze_monitoring_system/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gaze_analytics" = ["storage/schema.sql"]

# ---------------------------- Tooling ----------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=gaze_analytics --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
