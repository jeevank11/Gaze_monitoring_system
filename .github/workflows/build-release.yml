name: build-release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[dev]"
      - name: Build exe
        run: |
          pyinstaller --clean --onefile --name gaze-analytics `
            --paths src `
            --add-data "src/gaze_analytics/storage/schema.sql;gaze_analytics/storage" `
            --collect-all openvino --collect-all cv2 `
            --hidden-import gaze_analytics `
            src/gaze_analytics/__main__.py
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaze-analytics-windows-x64
          path: dist/gaze-analytics.exe

  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gaze-analytics:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/gaze-analytics:latest

  release:
    needs: [windows-exe, docker-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gaze-analytics-windows-x64
          path: ./release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/gaze-analytics.exe
          generate_release_notes: true
